services:
  forgejo:
    image: ghcr.io/gitlgbt/forgejo:latest
    container_name: forgejo-prod
    restart: always
    ports:
      - "3001:3000"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=https://git.lgbt/
      - GITEA__server__DOMAIN=git.lgbt
      - GITEA__server__SSH_DOMAIN=git.lgbt
    volumes:
      - ./forgejo-data:/data
      - ./theme/public:/data/gitea/public
      - ./theme/templates:/data/gitea/templates
      - /etc/localtime:/etc/localtime:ro